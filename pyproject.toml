[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quipu"
version = "0.3.0"
description = "Local-first agent memory: verbatim capture, a temporal knowledge graph, and lifecycle-labeled training data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daniel" }]
keywords = ["agent-memory", "knowledge-graph", "fine-tuning", "llm", "obsidian", "sqlite"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "build>=1.2"]

[project.scripts]
quipu = "quipu.cli:main"

[project.entry-points."hermes_agent.memory_providers"]
quipu = "quipu.hermes_provider:register"

[tool.hatch.build.targets.wheel]
packages = ["quipu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
