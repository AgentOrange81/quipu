[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigil-memory"
version = "0.8.0"
description = "Local-first agent memory: verbatim capture, a temporal knowledge graph, and lifecycle-labeled training data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daniel" }]
keywords = ["agent-memory", "knowledge-graph", "fine-tuning", "llm", "obsidian", "sqlite"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "build>=1.2"]

[project.scripts]
sigil = "sigil.cli:main"
sigil-capture = "sigil.capture:main"
# one release of grace: anything still calling the old names keeps working
quipu = "sigil.cli:main"
quipu-capture = "sigil.capture:main"

[project.entry-points."hermes_agent.memory_providers"]
sigil = "sigil:register"
quipu = "sigil:register"

[tool.hatch.build.targets.wheel]
packages = ["sigil", "quipu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
