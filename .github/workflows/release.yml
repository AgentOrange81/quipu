name: release

# A tag is the only thing that publishes. The job order is build -> verify on every supported
# interpreter -> create the GitHub Release. A wheel that installs but whose console script cannot
# import itself is the failure this chain exists to catch, and it is caught before the artifact is
# attached, so a broken tag leaves no release behind.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to publish (e.g. v0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: the wheel's version must match the tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import glob, os, sys
          tag = os.environ["TAG"].lstrip("v")
          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              sys.exit(f"expected one wheel, found {wheels}")
          if f"-{tag}-" not in os.path.basename(wheels[0]):
              sys.exit(f"tag {tag} does not match {os.path.basename(wheels[0])}")
          print("wheel matches tag:", wheels[0])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install the wheel into a clean venv and use it
        run: |
          python -m venv /tmp/relcheck
          /tmp/relcheck/bin/python -m pip install --upgrade pip >/dev/null
          /tmp/relcheck/bin/python -m pip install dist/*.whl
          /tmp/relcheck/bin/sigil --version
          /tmp/relcheck/bin/sigil --vault /tmp/relvault init
          /tmp/relcheck/bin/sigil --vault /tmp/relvault write --kind decision --state promoted \
            --summary "the wheel's console script runs" --evidence "pip install dist/*.whl" \
            --ask "does the released wheel work?" --project release
          /tmp/relcheck/bin/sigil --vault /tmp/relvault search "console script"
          /tmp/relcheck/bin/python -c "from sigil.mcp import serve; assert callable(serve)"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: release notes from the CHANGELOG section
        run: |
          python - "${{ github.event.inputs.tag || github.ref_name }}" > notes.md <<'PY'
          import re, sys
          version = sys.argv[1].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(version)}\b.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not m:
              sys.exit(f"no CHANGELOG section for {version}")
          print(m.group(0).strip())
          PY
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.event.inputs.tag || github.ref_name }}" dist/* \
            --title "sigil ${{ github.event.inputs.tag || github.ref_name }}" \
            --notes-file notes.md

  # Trusted publishing: GitHub mints a short-lived OIDC token and PyPI accepts it, so no API token is
  # ever created, stored in a secret, or rotated. Requires a publisher registered on PyPI with these
  # exact values — owner/repo/workflow/environment — or the upload fails with "trusted publishing
  # exchange failed", which is a loud, harmless failure: the GitHub release still exists.
  pypi:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sigil-memory/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: refuse to publish anything but a wheel and an sdist
        run: |
          ls dist
          test "$(ls dist/*.whl | wc -l)" -eq 1
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
